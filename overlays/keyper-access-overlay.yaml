overlay: 1.0.0
info:
  title: API Evangelist enhancements for keyper Access API
  version: 1.0.0
extends: openapi/keyper-access-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-enriched: '2026-07-19'
    x-apievangelist-source: https://github.com/keyper/keyper-access-api
    x-apievangelist-notes: Derived from keyper's published API Blueprint (apiary.apib).
- target: $.info
  update:
    x-api-provider: keyper
    x-api-industry: [ticketing, access-control, events]
- target: $.paths['/v1/transactions'].put
  update:
    x-agentic-consequence: write
- target: $.paths['/v1/permissions'].get
  update:
    x-agentic-consequence: read

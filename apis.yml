aid: keyper
name: Keyper
description: >-
  keyper is an Austrian technology company providing connected ticketing and
  digital access solutions. Its developer platform lets ticketing systems,
  resellers and access control systems (ACS) deliver e-tickets and exchange
  access data through the keyper Access API, Connect Provider / Reseller APIs,
  Ticket Delivery API, native Android and iOS SDKs, and embeddable web
  components (seatmaps and checkout). The Access API sends entry transactions
  for keys (ticket barcodes) and their permissions (events), and returns the
  Grant / Block permission whitelist an access control system enforces at the
  gate. keyper serves sports, arts and culture organisations across Austria and
  Central Europe and is backed by Speedinvest.
